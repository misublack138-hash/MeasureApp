<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeasureApp</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-card">

        <h1>📏 MeasureApp</h1>

        <p class="subtitle">
            Sistema de Registro de Medidas
        </p>

        <input
            type="text"
            id="usuario"
            placeholder="Usuário">

        <input
            type="password"
            id="senha"
            placeholder="Senha">

        <button onclick="login()">
            Entrar
        </button>

        <button onclick="mostrarCadastro()">
            Criar Conta
        </button>

        <div id="status"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
